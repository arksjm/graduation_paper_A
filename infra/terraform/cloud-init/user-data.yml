#cloud-config
hostname: ubuntu-server
users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: sudo, docker
    shell: /bin/bash
    lock_passwd: false
    passwd: $6$rounds=4096$y0UoJt3B$rh5VxZk5H1tM9xR7zQ3oYk5pL8mN2wX4cV6bJ7dF0eK9sT1uA3iG5hJ8lK4mN6pQ1rS2tV5wX7yZ0aB3cD5eF7gH

ssh_pwauth: true
password: 1234
chpasswd:
  expire: false

package_update: true
package_upgrade: true

packages:
  - openssh-server
  - curl
  - wget
  - git
  - vim
  - htop

runcmd:
  - echo "ubuntu:ubuntu" | chpasswd
  - sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
  - sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
  - systemctl restart sshd
