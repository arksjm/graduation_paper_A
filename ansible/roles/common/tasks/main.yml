---
- name: Обновление apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Установка базовых пакетов
  apt:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - net-tools
      - python3
      - python3-pip
      - ca-certificates
      - gnupg
      - lsb-release
      - software-properties-common
    state: present

- name: Проверка наличия Docker
  stat:
    path: /usr/bin/docker
  register: docker_check

- name: Установка Docker
  shell: |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
    apt-get update
    apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  args:
    executable: /bin/bash
  when: not docker_check.stat.exists

- name: Запуск Docker
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Добавление пользователя vagrant в группу docker
  user:
    name: vagrant
    groups: docker
    append: yes

- name: Установка Node Exporter в Docker
  docker_container:
    name: node_exporter
    image: prom/node-exporter:latest
    restart_policy: always
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    ports:
      - "9100:9100"
