---
- name: Создание директории для мониторинга
  file:
    path: /opt/monitoring
    state: directory
    mode: '0755'

- name: Создание конфигурации Prometheus
  copy:
    dest: /opt/monitoring/prometheus.yml
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      rule_files:
        - 'alerts.yml'

      scrape_configs:
        - job_name: 'node_exporter'
          static_configs:
            - targets:
                - '192.168.56.10:9100'
                - '192.168.56.11:9100'
                - '192.168.56.12:9100'

        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']

        - job_name: 'blackbox_http'
          metrics_path: /probe
          params:
            module: [http_2xx]
          static_configs:
            - targets:
                - http://192.168.56.10
                - http://192.168.56.10/health
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: blackbox_exporter:9115

- name: Создание правил алертов
  copy:
    dest: /opt/monitoring/alerts.yml
    content: |
      groups:
        - name: infrastructure_alerts
          rules:
            - alert: HostDown
              expr: up == 0
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "Хост недоступен"
                description: "Хост не отвечает более 1 минуты"

            - alert: HighCPUUsage
              expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Высокая загрузка CPU"
                description: "CPU используется более 80% в течение 5 минут"

            - alert: LowMemory
              expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Мало памяти"
                description: "Доступно менее 10% памяти"

        - name: application_alerts
          rules:
            - alert: AppDown
              expr: probe_success == 0
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "Приложение недоступно"
                description: "Приложение не отвечает более 2 минут"

- name: Создание docker-compose для мониторинга
  copy:
    dest: /opt/monitoring/docker-compose.yml
    content: |
      services:
        prometheus:
          image: prom/prometheus:latest
          container_name: prometheus
          restart: always
          volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
            - ./alerts.yml:/etc/prometheus/alerts.yml
            - prometheus_data:/prometheus
          ports:
            - "9090:9090"
          networks:
            - monitoring

        grafana:
          image: grafana/grafana:latest
          container_name: grafana
          restart: always
          environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin
          ports:
            - "3000:3000"
          volumes:
            - grafana_data:/var/lib/grafana
          networks:
            - monitoring

        blackbox_exporter:
          image: prom/blackbox-exporter:latest
          container_name: blackbox_exporter
          restart: always
          ports:
            - "9115:9115"
          networks:
            - monitoring

      networks:
        monitoring:
          driver: bridge

      volumes:
        prometheus_data:
        grafana_data:

- name: Перезапуск мониторинга
  shell: |
    cd /opt/monitoring
    docker compose down
    docker compose up -d
  args:
    executable: /bin/bash

- name: Ожидание запуска Prometheus
  wait_for:
    port: 9090
    host: localhost
    timeout: 60
